name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck payloads
        # payload.sh is Bash. SC2140: payloads intentionally join quoted strings across lines.
        # SC2059: printf formats on purpose. SC2163: Hak5 commands are exported by name on purpose.
        run: |
          find payloads -name payload.sh -print0 | \
            xargs -0 shellcheck -s bash -S warning -e SC2034,SC2155,SC2140,SC2059,SC2163
      - name: Bash syntax
        run: find payloads -name payload.sh -exec bash -n {} \;
