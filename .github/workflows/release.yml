name: release

# Publishing a release (tag like v1.0.1) attaches that version's payload.sh, ready to load on the Hub.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Attach payload.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" payloads/library/general/TurtleTAK-Hub/payload.sh --clobber
